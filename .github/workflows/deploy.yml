# Deploys the APP to AWS on every push to main. Infrastructure lives in .github/workflows/infra.yml
# and is applied by hand; nothing here runs Terraform.
#
# What it needs from infra (bucket, distribution, function names, site URL) comes from the SSM
# parameter that `terraform apply` writes — see aws_ssm_parameter.deploy_targets in infra/outputs.tf.
#
# One-time setup: README.md → "Deploying to AWS".
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # GitHub OIDC → AWS
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment: production
    # On the job, not the workflow: otherwise the `check` job above (npm ci + typecheck + build)
    # holds the production lock for minutes without touching AWS. Shared with infra.yml's apply.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      AWS_REGION: us-east-1
      NEXT_TELEMETRY_DISABLED: "1"
      SSM_PARAMETER: /doless/deploy-targets
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      # Fails in seconds, by name, instead of deep inside the AWS login.
      - name: Check deploy configuration
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          DODO_API_KEY: ${{ secrets.DODO_API_KEY }}
          DODO_ENVIRONMENT: ${{ vars.DODO_ENVIRONMENT || 'test_mode' }}
        run: |
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "::error::AWS_ROLE_ARN (variable) isn't visible to this job. Add it to the 'production' environment (or the repository) under Settings → Secrets and variables → Actions."
            exit 1
          fi
          case "$AWS_ROLE_ARN" in
            */doless-gha-deploy) ;;
            *) echo "::warning::AWS_ROLE_ARN is $AWS_ROLE_ARN; the role infra/bootstrap.sh set up is doless-gha-deploy." ;;
          esac
          # The buy button is baked at build time, so this job needs the key even though the
          # Lambda gets its own copy from Terraform. Mismatched halves = a button that 503s.
          if [ "$DODO_ENVIRONMENT" = "live_mode" ] && [ -z "$DODO_API_KEY" ]; then
            echo "::error::DODO_ENVIRONMENT is live_mode but the DODO_API_KEY secret isn't visible to this job, so the build would bake a site with no buy buttons."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read deploy targets
        run: |
          set -euo pipefail
          if ! targets=$(aws ssm get-parameter --name "$SSM_PARAMETER" \
                           --query Parameter.Value --output text 2>/dev/null); then
            echo "::error::$SSM_PARAMETER not found. Run the Infra workflow (apply) once before deploying code."
            exit 1
          fi
          printf '%s' "$targets" > "$RUNNER_TEMP/targets.json"
          for k in site_url site_bucket cloudfront_distribution_id server_function image_function; do
            v=$(jq -er --arg k "$k" '.[$k]' "$RUNNER_TEMP/targets.json") || {
              echo "::error::$SSM_PARAMETER is missing '$k'. Re-run the Infra workflow (apply)."
              exit 1
            }
            echo "$(echo "$k" | tr '[:lower:]' '[:upper:]')=$v" >> "$GITHUB_ENV"
          done

      # Infra is applied by hand while this runs automatically, so a commit touching both can land
      # here first. A new top-level public/ folder without its CloudFront behavior falls through to
      # the server function, which does not contain public/ — i.e. silent 404s. Catch it before the
      # build rather than after the deploy.
      - name: Check public/ against the applied CloudFront behaviors
        run: |
          set -euo pipefail
          shopt -s nullglob # an unmatched public/* must expand to nothing, not to the literal glob
          have=$(for f in public/*; do
                   b=$(basename "$f")
                   if [ -d "$f" ]; then echo "/$b/*.*"; else echo "/$b"; fi
                 done | sort -u | paste -sd, -)
          want=$(jq -r '.public_paths | sort | join(",")' "$RUNNER_TEMP/targets.json")
          if [ "$have" != "$want" ]; then
            echo "::error::public/ resolves to ($have) but the applied CloudFront behaviors are ($want). Dispatch the Infra workflow (apply) first."
            exit 1
          fi

      # The site URL is baked into the build (metadata, sitemap, Open Graph).
      #
      # The Dodo pair is here for the same reason: checkoutHrefFor() runs at BUILD time, because the
      # solution detail pages are prerendered via generateStaticParams. Terraform setting these on the
      # function is not enough — without them here the buy button is absent from the deployed HTML.
      # That is also why switching payments on is a redeploy, not an env change.
      - name: Build app and Lambda bundles
        env:
          DODO_PAYMENTS_API_KEY: ${{ secrets.DODO_API_KEY }}
          DODO_PAYMENTS_ENVIRONMENT: ${{ vars.DODO_ENVIRONMENT || 'test_mode' }}
        run: NEXT_PUBLIC_SITE_URL="$SITE_URL" npm run build:aws

      # Before the new code goes live, so its pages never point at files that aren't there yet.
      - name: Upload build output
        run: infra/upload.sh "$SITE_BUCKET"

      # Ahead of the code update on purpose: old code against the new schema is the safe direction.
      # The corollary is that migrations must stay backwards-compatible with the running code —
      # drizzle-kit is forward-only, there is nothing to roll back to.
      - name: Run database migrations
        if: env.DATABASE_URL != ''
        run: npm run db:migrate

      # Keyed by commit so a rollback needs no rebuild: point both functions back at an older SHA's
      # zips and invalidate. The old build's _next/ chunks and _cache/ entries are still in S3,
      # because infra/upload.sh never deletes.
      - name: Ship Lambda bundles
        run: |
          set -euo pipefail
          prefix="_lambda/$GITHUB_SHA"
          (cd .open-next/server-functions/default && zip -qr "$RUNNER_TEMP/server.zip" .)
          (cd .open-next/image-optimization-function && zip -qr "$RUNNER_TEMP/image.zip" .)
          aws s3 cp "$RUNNER_TEMP/server.zip" "s3://$SITE_BUCKET/$prefix/server.zip" --only-show-errors
          aws s3 cp "$RUNNER_TEMP/image.zip" "s3://$SITE_BUCKET/$prefix/image.zip" --only-show-errors

          # A concurrent `terraform apply` — including from a laptop — makes this return
          # ResourceConflictException while the function is already updating.
          ship() {
            for attempt in 1 2 3; do
              if aws lambda update-function-code --function-name "$1" \
                   --s3-bucket "$SITE_BUCKET" --s3-key "$2" >/dev/null; then
                return 0
              fi
              echo "::warning::update-function-code on $1 failed (attempt $attempt/3); retrying in 15s"
              sleep 15
            done
            echo "::error::Could not update $1 after 3 attempts."
            return 1
          }
          ship "$SERVER_FUNCTION" "$prefix/server.zip"
          ship "$IMAGE_FUNCTION" "$prefix/image.zip"

          # Both must settle before the invalidation, or the edge refills from the old code.
          aws lambda wait function-updated-v2 --function-name "$SERVER_FUNCTION"
          aws lambda wait function-updated-v2 --function-name "$IMAGE_FUNCTION"

      # Prerendered pages are cached at the edge until the next deploy; this is that point.
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation --paths "/*" \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" >/dev/null

      - name: Summary
        run: echo "Deployed $GITHUB_SHA to $SITE_URL" >> "$GITHUB_STEP_SUMMARY"
